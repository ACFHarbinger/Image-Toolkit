version: 2

# Note: C++ dependencies (CMake/vcpkg/Conan in base/) have no native
# Dependabot ecosystem support and are therefore not tracked here.
#
# Rust `base` module was fully retired to archive/rust/ (Rust -> C++
# migration, see https://github.com/ACFHarbinger/Anime-Stitch-Pipeline/blob/main/moon/ROADMAP.md history) — archive/rust/Cargo.toml is
# intentionally NOT scanned. The only live Cargo.toml is the root workspace
# manifest, whose sole member is frontend/src-tauri (the Tauri desktop shell).
#
# app/android is temporarily excluded from the root settings.gradle.kts
# `include(":app")` (see commit 140b4242, "Hotfix for gradle build of android
# app") but remains an actively developed, independently-buildable Gradle
# module (docs/moon/roadmaps/architecture.md §5.6 Mobile App Feature Parity
# Backlog) — Dependabot has already opened and merged bump PRs against it
# (e.g. PR #5), so it is scanned directly by directory.

updates:
  # ── Python (uv) ───────────────────────────────────────────────────────────
  # pyproject.toml + uv.lock at repo root; `uv sync --frozen` is the CI/build
  # path (see .github/workflows/security.yml, docker/Dockerfile). No
  # requirements.txt exists, so the dedicated "uv" ecosystem (not "pip") is
  # required for Dependabot to resolve against uv.lock correctly.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      uv-dependencies:
        patterns:
          - "*"

  # ── Rust / Cargo ──────────────────────────────────────────────────────────
  # Root workspace (Cargo.toml) covers frontend/src-tauri as its only member.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # ── Kotlin / Gradle ───────────────────────────────────────────────────────
  - package-ecosystem: "gradle"
    directory: "/app/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      kotlin-android-dependencies:
        patterns:
          - "*"

  