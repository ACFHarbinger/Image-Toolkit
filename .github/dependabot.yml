version: 2

# Note: C++ dependencies (CMake/vcpkg/Conan in base/) have no native
# Dependabot ecosystem support and are therefore not tracked here.
#
# Rust `base` module was fully retired to archive/rust/ (Rust -> C++
# migration, see https://github.com/ACFHarbinger/Anime-Stitch-Pipeline/blob/main/moon/ROADMAP.md history) — archive/rust/Cargo.toml is
# intentionally NOT scanned. The only live Cargo.toml is the root workspace
# manifest, whose sole member is frontend/src-tauri (the Tauri desktop shell).
#
# app/android is temporarily excluded from the root settings.gradle.kts
# `include(":app")` (see commit 140b4242, "Hotfix for gradle build of android
# app") but remains an actively developed, independently-buildable Gradle
# module (docs/moon/roadmaps/architecture.md §5.6 Mobile App Feature Parity
# Backlog) — Dependabot has already opened and merged bump PRs against it
# (e.g. PR #5), so it is scanned directly by directory.

updates:
  # ── Python (uv) ───────────────────────────────────────────────────────────
  # pyproject.toml + uv.lock at repo root; `uv sync --frozen` is the CI/build
  # path (see .github/workflows/security.yml, docker/Dockerfile). No
  # requirements.txt exists, so the dedicated "uv" ecosystem (not "pip") is
  # required for Dependabot to resolve against uv.lock correctly.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      uv-dependencies:
        patterns:
          - "*"
    # Transitive via fiftyone extra (voxel51-eta 0.16 needs paramiko<4).
    # A paramiko 5 bump forces fiftyone 1.21 as a side effect — #460/#656.
    ignore:
      - dependency-name: "paramiko"
        update-types: ["version-update:semver-major"]

  # ── Rust / Cargo ──────────────────────────────────────────────────────────
  # Root workspace (Cargo.toml) covers frontend/src-tauri as its only member.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # ── JavaScript / npm ──────────────────────────────────────────────────────
  # Without an entry here, npm bumps only arrive as GitHub security-update PRs,
  # which Dependabot cannot rebase (see #655).
  - package-ecosystem: "npm"
    # /frontend has no lockfile of its own (removed): it is a declared
    # workspace member of the root package.json, so `npm ci`/`npm install`
    # anywhere under it resolve to the root install and root's lockfile --
    # a standalone frontend/package-lock.json was never actually consulted
    # by any real install and only produced false "already patched" signal.
    directories:
      - "/"
      - "/extension"
      - "/docs/website"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"
    # typescript 7 breaks `npm ci` in docs/website: @typescript-eslint 8.x
    # peers typescript <6.1.0 (ERESOLVE, PR #659). Revisit when it supports 7.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # ── Kotlin / Gradle ───────────────────────────────────────────────────────
  - package-ecosystem: "gradle"
    directory: "/app/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      kotlin-android-dependencies:
        patterns:
          - "*"

  