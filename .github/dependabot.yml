version: 2

# Note: C++ dependencies (CMake/vcpkg/Conan in base/) have no native
# Dependabot ecosystem support and are therefore not tracked here.
#
# Rust `base` module was fully retired to archive/rust/ (Rust -> C++
# migration, see https://github.com/ACFHarbinger/Anime-Stitch-Pipeline/blob/main/moon/ROADMAP.md history) — archive/rust/Cargo.toml is
# intentionally NOT scanned. The only live Cargo.toml is the root workspace
# manifest, whose sole member is frontend/src-tauri (the Tauri desktop shell).
#
# app/android is temporarily excluded from the root settings.gradle.kts
# `include(":app")` (see commit 140b4242, "Hotfix for gradle build of android
# app") but remains an actively developed, independently-buildable Gradle
# module (docs/moon/roadmaps/architecture.md §5.6 Mobile App Feature Parity
# Backlog) — Dependabot has already opened and merged bump PRs against it
# (e.g. PR #5), so it is scanned directly by directory.

updates:
  # ── Python (uv) ───────────────────────────────────────────────────────────
  # pyproject.toml + uv.lock at repo root; `uv sync --frozen` is the CI/build
  # path (see .github/workflows/security.yml, docker/Dockerfile). No
  # requirements.txt exists, so the dedicated "uv" ecosystem (not "pip") is
  # required for Dependabot to resolve against uv.lock correctly.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      uv-dependencies:
        patterns:
          - "*"

  # ── Rust / Cargo ──────────────────────────────────────────────────────────
  # Root workspace (Cargo.toml) covers frontend/src-tauri as its only member.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      rust-dependencies:
        patterns:
          - "*"

  # ── Kotlin / Gradle ───────────────────────────────────────────────────────
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      kotlin-root-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/app/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      kotlin-android-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gradle"
    directory: "/cryptography"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      kotlin-cryptography-dependencies:
        patterns:
          - "*"

  # ── Swift (iOS) ───────────────────────────────────────────────────────────
  # app/ios is a real, actively developed SwiftUI app (DocC-documented,
  # wired into docs.yml) with its own Package.swift (Kingfisher dependency).
  - package-ecosystem: "swift"
    directory: "/app/ios"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      swift-ios-dependencies:
        patterns:
          - "*"

  # ── TypeScript / npm ──────────────────────────────────────────────────────
  # Root package.json is an npm workspace that includes frontend/ as a member.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns:
          - "*"

  # extension/ is a separate WebExtension (webpack + TS) project with its own
  # package-lock.json — it is NOT part of the root npm workspace (which only
  # lists "frontend"), so it needs its own entry.
  - package-ecosystem: "npm"
    directory: "/extension"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-extension-dependencies:
        patterns:
          - "*"

  # ── Docker ────────────────────────────────────────────────────────────────
  # docker/ is the live Django/Celery backend container stack (docker/Dockerfile
  # + docker/docker-compose.yml), added for backend deployment.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "docker-compose"
    directory: "/docker"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      docker-compose-dependencies:
        patterns:
          - "*"

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # Keeps workflow action versions (actions/checkout, actions/upload-artifact,
  # etc.) current. Always safe and low-noise to include.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
