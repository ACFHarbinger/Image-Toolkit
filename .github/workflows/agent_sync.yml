name: Agent Backlog Sync

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you running this?"
        required: false
        default: "Manual trigger"

# Cancel in-progress runs for the same branch on new push
concurrency:
  group: agent-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-backlog:
    name: Gemini-driven Project Board sync
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # need HEAD~1 to diff the pushed commit

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: latest

      - name: Install script dependencies (ci extra, skip C++ build)
        run: uv sync --frozen --extra ci --no-install-project

      - name: Run backlog sync
        # sync_backlog.py imports agent_tools via a relative import, so it
        # must run as the `git.scripts` package (cwd at the repo root)
        # rather than as a bare script -- same reasoning as
        # git/hooks/post-commit's check_commit_ref.py invocation.
        run: cd "$GITHUB_WORKSPACE" && uv run python -m git.scripts.sync_backlog
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ secrets.REPO_PROJECT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          GITHUB_PROJECT_OWNER: ${{ github.repository_owner }}
