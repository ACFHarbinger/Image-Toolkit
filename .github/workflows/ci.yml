name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-src:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras --dev
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest test -v --cov=src --cov-report=xml
      - run: uv build --all-packages
      - uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint-test-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --all-extras --dev
      - run: uv run --package cel-shaded-generator-gui ruff check gui
      - run: uv run --package cel-shaded-generator-gui mypy gui/src
      - run: uv run --package cel-shaded-generator-gui pytest gui/test -v
