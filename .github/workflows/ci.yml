name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch on new push
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Import-linter + mypy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-lint-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-lint-${{ runner.os }}-

      - name: Install project dependencies (frozen, skip C++ build)
        # --no-install-project skips the C++ extension build so it is not
        # compiled.  All Python runtime and dev deps are installed from the lockfile.
        run: uv sync --frozen --group dev --no-install-project

      - name: Run import-linter contracts (§5.11A / A.17)
        run: uv run lint-imports
        env:
          PYTHONPATH: .

      - name: Run gui init-boundary checks (issue #530 / D9)
        run: uv run python backend/validation/check_init_boundaries.py

      - name: Run worker-base adoption check (R1.1 / #556)
        run: uv run python backend/validation/check_worker_base.py

      - name: mypy — strict modules (§5.5A / A.10)
        run: >
          uv run mypy
          backend/src/errors/exceptions.py
          backend/src/models/core/base.py
          --ignore-missing-imports
          --no-error-summary
        env:
          PYTHONPATH: .

  test-models:
    name: Model wrapper contracts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-test-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-test-${{ runner.os }}-

      - name: Init ASP submodule (asp_backend wrapper tests)
        # test_wrapper_contracts.py imports asp_backend.models.wrappers.*
        # (RoMa / ALIKED). Registered from submodules/ASP by conftest.
        run: git submodule update --init submodules/ASP

      - name: Install project dependencies (frozen)
        # backend/test/conftest.py eagerly imports src.core / src.web at
        # collection, which pull the backend's real runtime deps (yaml,
        # loguru, cv2, scipy, pyside6, bs4, screeninfo, ...). --no-install-project
        # skips workspace-member deps, so those must be installed.
        run: uv sync --frozen --package image-toolkit-backend --group dev

      - name: Run model contract tests (§5.16A / A.9)
        # Heavy deps are patched into sys.modules by the tests themselves;
        # --skip-gpu drops the few that need a real CUDA device.
        run: uv run pytest backend/test/models/ -q --tb=short --skip-gpu
        env:
          PYTHONPATH: .

  pytest:
    name: Python unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-pytest-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-pytest-${{ runner.os }}-

      - name: Install project dependencies (frozen)
        # conftest collection imports the backend's real deps; the C++ base
        # extension is still built explicitly in a later step.
        run: uv sync --frozen --package image-toolkit-backend --package image-toolkit-gui --group dev

      - name: Install system C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev libssl-dev libfftw3-dev libsodium-dev libsqlcipher-dev ninja-build libeigen3-dev libpulse0 libegl1 libgl1 libxkbcommon0 libxcb-cursor0 ffmpeg

      - name: Build native crypto library
        run: |
          mkdir -p build/crypto
          cc -O2 -fPIC -shared -o build/crypto/libitk_crypto.so base/src/secret/itk_crypto.c -lcrypto

      - name: Init submodules needed by CMake and GUI tests
        # ASP+HIE: base/CMakeLists.txt sources. CSG: gui.tabs imports csg_gui.
        # CRE: EncryptedSQLiteStore tests. Not checkout submodules: recursive
        # (that also pulls vendor/OpenCV, ComfyUI, Hugin). No --depth 1.
        run: git submodule update --init submodules/ASP submodules/HIE submodules/CSG submodules/CRE

      - name: Build and install C++ base extension
        run: |
          uv run cmake -B build/base base/ -G Ninja -DCMAKE_BUILD_TYPE=Release
          uv run cmake --build build/base --parallel
          uv run cmake --install build/base --prefix .
          SITE_PKGS=$(uv run python -c "import site; print(site.getsitepackages()[0])")
          cp -f base*.so "$SITE_PKGS/" || true

      - name: Run backend pytest
        # Separate process from gui/test: gui conftest replaces cv2 and
        # backend.src.models with MagicMocks, which leaks into backend
        # collection in a combined run (mock imread / ComfyUIManager).
        run: uv run pytest backend/test --skip-gpu -m "not slow" -q --tb=short --timeout=120
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen

      - name: Run GUI pytest
        # --skip-gpu lives in backend/test/conftest.py and is unregistered
        # in a gui-only process. --run-gui keeps @pytest.mark.gui tests.
        # timeout-method=thread: a wedged Qt event loop ignores SIGALRM, so
        # the default signal method never fires — the watchdog thread dumps
        # every stack and hard-exits, naming the offending test.
        run: uv run pytest gui/test -m "not slow" -q --tb=short --run-gui --timeout=120 --timeout-method=thread
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen

  pytest-slow:
    name: Python slow integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-pytest-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-pytest-${{ runner.os }}-

      - name: Install project dependencies (frozen)
        # conftest collection imports the backend's real deps; the C++ base
        # extension is still built explicitly in a later step.
        run: uv sync --frozen --package image-toolkit-backend --package image-toolkit-gui --group dev

      - name: Install system C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev libssl-dev libfftw3-dev libsodium-dev libsqlcipher-dev ninja-build libeigen3-dev libpulse0 libegl1 libgl1 libxkbcommon0 libxcb-cursor0 ffmpeg

      - name: Build native crypto library
        run: |
          mkdir -p build/crypto
          cc -O2 -fPIC -shared -o build/crypto/libitk_crypto.so base/src/secret/itk_crypto.c -lcrypto

      - name: Init submodules needed by CMake and GUI tests
        # ASP+HIE: base/CMakeLists.txt sources. CSG: gui.tabs imports csg_gui.
        # CRE: EncryptedSQLiteStore tests. Not checkout submodules: recursive
        # (that also pulls vendor/OpenCV, ComfyUI, Hugin). No --depth 1.
        run: git submodule update --init submodules/ASP submodules/HIE submodules/CSG submodules/CRE

      - name: Build and install C++ base extension
        run: |
          uv run cmake -B build/base base/ -G Ninja -DCMAKE_BUILD_TYPE=Release
          uv run cmake --build build/base --parallel
          uv run cmake --install build/base --prefix .
          SITE_PKGS=$(uv run python -c "import site; print(site.getsitepackages()[0])")
          cp -f base*.so "$SITE_PKGS/" || true

      - name: Run slow backend pytest
        # exit 5 = "no tests collected": there are currently no in-tree
        # @pytest.mark.slow tests (all live under submodules/*/test), so an
        # empty selection is not a failure.
        run: uv run pytest backend/test --skip-gpu -m "slow" -q --tb=short --timeout=600 || [ $? -eq 5 ]
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen

      - name: Run slow GUI pytest
        run: uv run pytest gui/test -m "slow" -q --tb=short --run-gui --timeout=600 --timeout-method=thread || [ $? -eq 5 ]
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen

  # ── §5.17A: CI-enforced LoC gate ───────────────────────────────────────
  # Fails if any .py file under backend/src or gui/src exceeds 500 code
  # lines, unless listed in docs/loc_exceptions.txt. Checked on every PR
  # and push to main.
  loc-gate:
    name: LoC gate (max 500 code lines per file)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-loc-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-loc-${{ runner.os }}-

      - name: Install dependencies (frozen, skip C++ build)
        run: uv sync --frozen --group dev --no-install-project

      - name: Run LoC gate
        run: >
          uv run python backend/validation/count_loc.py
          backend/src gui/src
          --max-code-lines 500
          --exceptions-file docs/loc_exceptions.txt
          --fail-over
        env:
          PYTHONPATH: .

  # ── §5.17D: Auto-generated LoC dashboard ──────────────────────────────
  # Regenerates docs/loc_report.md on every push to main and commits it
  # back so the worst-offenders list never goes stale between manual audits.
  loc-dashboard:
    name: LoC dashboard (auto-update docs/loc_report.md)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Restore uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-loc-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-loc-${{ runner.os }}-

      - name: Install dependencies (frozen, skip C++ build)
        run: uv sync --frozen --group dev --no-install-project

      - name: Generate LoC report
        run: >
          uv run python backend/validation/count_loc.py
          backend/src gui/src
          --sort code --limit 50
          --markdown-out docs/loc_report.md
        env:
          PYTHONPATH: .

      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/loc_report.md
          if git diff --staged --quiet; then
            echo "No changes to loc_report.md — skipping commit."
          else
            git commit -m "docs: auto-update LoC dashboard [skip ci]"
            git push
          fi

  frontend-extension:
    name: Frontend and WebExtension builds
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Init HIE submodule
        # frontend/package.json links to file:../submodules/HIE/frontend
        run: git submodule update --init submodules/HIE

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Build frontend (React)
        run: npm run build-frontend
        env:
          CI: false

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Typecheck extension
        working-directory: extension
        run: npm run typecheck

      - name: Build extension (all targets)
        working-directory: extension
        run: npm run build:all
