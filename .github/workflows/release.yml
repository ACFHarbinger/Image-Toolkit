name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (upload artifacts only, do not create GitHub Release)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Desktop (AppImage + .deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The C++ base extension needs OpenCV >= 4.6 with a CMake config; Ubuntu
      # 22.04 apt ships 4.5.4. pixi (conda-forge) is the environment the repo
      # actually builds in — opencv >=4.8, cmake, ninja, eigen, pybind11 and a
      # `build-base` task all declared in pixi.toml. Use it here too.
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.11
        with:
          environments: dev
          cache: true

      - name: Install AppImage / Qt runtime system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlcipher-dev libsodium-dev \
            libgl1-mesa-dev libglib2.0-0 libegl1 \
            fuse file dpkg-dev

      - name: Build the C++ base extension
        run: |
          pixi run -e dev build-base
          # Stage the built module where imports and the PyInstaller spec expect
          # it: repo root (matches the checked-in base.cpython-*.so location) and
          # the pixi env site-packages.
          cp -f build/base/base*.so .
          SITE_PKGS=$(pixi run -e dev python -c "import site; print(site.getsitepackages()[0])")
          cp -f build/base/base*.so "$SITE_PKGS/" || true

      - name: Build native crypto library
        run: |
          mkdir -p build/crypto
          cc -O2 -fPIC -shared -o build/crypto/libitk_crypto.so \
            base/src/secret/itk_crypto.c -lcrypto

      - name: Package Linux release (AppImage and .deb)
        run: pixi run -e dev python tools/release/package_linux.py

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/release/*
          if-no-files-found: error

  # Windows native build is UNRESOLVED: pixi.toml only solves linux-64, so the
  # C++ base extension has no conda toolchain on Windows, and Ubuntu-style apt
  # OpenCV isn't available either. Kept here (non-blocking) so the decision —
  # ship Linux-only for 1.0.0 vs. invest in an MSVC + prebuilt-OpenCV path — is
  # visible in CI. Does not gate publish-release.
  build-windows:
    name: Build Windows Desktop (Zip) [non-blocking]
    runs-on: windows-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Python dependencies
        run: uv sync --frozen --group dev --no-install-project

      - name: Package Windows release (Zip)
        run: uv run python tools/release/package_windows.py

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/release/*
          if-no-files-found: warn

  publish-release:
    name: Publish Release Draft
    needs: [build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-in

      - name: Flatten release artifacts and checksum
        run: |
          mkdir -p dist/release
          find dist/release-in/ -type f -exec cp -t dist/release/ {} + || true
          python tools/release/generate_checksums.py
          ls -la dist/release/

      - name: Upload combined artifacts and checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-all-checksums
          path: dist/release/*

      - name: Determine if drafting a Release
        id: release_check
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ startsWith(github.ref_name, 'v') }}" = "true" ]; then
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft GitHub Release
        if: steps.release_check.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: dist/release/*
          generate_release_notes: true
