name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (upload artifacts only, do not create GitHub Release)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Desktop (AppImage + .deb)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # The C++ base extension needs OpenCV >= 4.6 with a CMake config; Ubuntu
      # 22.04 apt ships 4.5.4. pixi (conda-forge) is the environment the repo
      # actually builds in — opencv >=4.8, cmake, ninja, eigen, pybind11 and a
      # `build-base` task all declared in pixi.toml. Use it here too.
      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.11
        with:
          environments: dev
          cache: true

      - name: Install AppImage / Qt runtime system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlcipher-dev libsodium-dev \
            libgl1-mesa-dev libglib2.0-0 libegl1 \
            fuse file dpkg-dev

      - name: Build the C++ base extension
        run: |
          pixi run -e dev build-base
          # Stage the built module where imports and the PyInstaller spec expect
          # it: repo root (matches the checked-in base.cpython-*.so location) and
          # the pixi env site-packages.
          cp -f build/base/base*.so .
          SITE_PKGS=$(pixi run -e dev python -c "import site; print(site.getsitepackages()[0])")
          cp -f build/base/base*.so "$SITE_PKGS/" || true

      - name: Build native crypto library
        run: |
          mkdir -p build/crypto
          # Link against the pixi env's OpenSSL (3.6+), not the ubuntu-22.04
          # system OpenSSL (3.0.2). The bundle also carries conda's libs2n /
          # aws-c-* (via pyarrow), which need OPENSSL_3.4.0 — if PyInstaller
          # bundles the older system libcrypto.so.3 the app dies at cv2 import
          # with "version `OPENSSL_3.4.0' not found".
          CONDA_PREFIX="$(pixi run -e dev python -c 'import sys,os; print(os.path.dirname(os.path.dirname(sys.executable)))')"
          pixi run -e dev cc -O2 -fPIC -shared -o build/crypto/libitk_crypto.so \
            base/src/secret/itk_crypto.c \
            -I"${CONDA_PREFIX}/include" -L"${CONDA_PREFIX}/lib" \
            -Wl,-rpath,'$ORIGIN' -lcrypto

      - name: Package Linux release (AppImage and .deb)
        run: |
          # Force PyInstaller's shared-lib resolution to the pixi env first, so a
          # single consistent libcrypto/libssl (conda's) is bundled.
          CONDA_PREFIX="$(pixi run -e dev python -c 'import sys,os; print(os.path.dirname(os.path.dirname(sys.executable)))')"
          export LD_LIBRARY_PATH="${CONDA_PREFIX}/lib:${LD_LIBRARY_PATH:-}"
          pixi run -e dev python tools/release/package_linux.py

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/release/*
          if-no-files-found: error

  # Windows build — added in v1.1 (#471). Uses pixi (conda-forge) for MSVC
  # toolchain, OpenCV, libsodium. SQLCipher is installed via vcpkg (not on
  # conda-forge for win-64). Bundles unsigned (SmartScreen warning accepted).
  build-windows:
    name: Build Windows Desktop (zip)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC Developer Environment
        # Activates cl.exe + its runtime DLLs on PATH for the whole job.
        # Without this, pixi install's PyPI sdist builds (e.g. stringzilla)
        # and later cmake/cl invocations fail because cl.exe's runtime
        # DLLs are not on PATH even though vswhere finds VS.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.8.11
        with:
          environments: dev
          cache: true

      - name: Install SQLCipher via vcpkg
        # SQLCipher is not on conda-forge for win-64. vcpkg builds it with
        # MSVC and installs to C:/vcpkg/installed/x64-windows/. The CMakeLists.txt
        # find_path/find_library fallbacks search this path. crypto3 (vcpkg's
        # OpenSSL dep) is pulled in transitively.
        run: |
          vcpkg install sqlcipher:x64-windows
          echo "VCPKG_INSTALLED_DIR=C:/vcpkg/installed" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build the C++ base extension
        run: |
          $condaPrefix = pixi run -e dev python -c "import sys,os; print(os.path.dirname(os.path.dirname(sys.executable)))"
          pixi run -e dev cmake -B build/base base/ -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$condaPrefix;C:/vcpkg/installed/x64-windows"
          pixi run -e dev cmake --build build/base --parallel
          # Stage the built .pyd where imports and the PyInstaller spec expect it.
          copy build\base\base*.pyd .
          $sitePkgs = pixi run -e dev python -c "import site; print(site.getsitepackages()[0])"
          copy build\base\base*.pyd "$sitePkgs\" || true
        shell: pwsh

      - name: Build native crypto library
        run: |
          New-Item -ItemType Directory -Force -Path build\crypto
          $condaPrefix = pixi run -e dev python -c "import sys,os; print(os.path.dirname(os.path.dirname(sys.executable)))"
          pixi run -e dev cl /O2 /LD /I"$condaPrefix\include" base\src\secret\itk_crypto.c /Fe:build\crypto\libitk_crypto.dll /link /LIBPATH:"$condaPrefix\lib" libcrypto.lib
        shell: pwsh

      - name: Package Windows release (zip)
        run: pixi run -e dev python tools/release/package_windows.py

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/release/*
          if-no-files-found: error

  publish-release:
    name: Publish Release Draft
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release-in

      - name: Flatten release artifacts and checksum
        run: |
          mkdir -p dist/release
          find dist/release-in/ -type f -exec cp -t dist/release/ {} + || true
          python tools/release/generate_checksums.py
          ls -la dist/release/

      - name: Upload combined artifacts and checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-all-checksums
          path: dist/release/*

      - name: Determine if drafting a Release
        id: release_check
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ startsWith(github.ref_name, 'v') }}" = "true" ]; then
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.dry_run }}" = "false" ]; then
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft GitHub Release
        if: steps.release_check.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}
          files: dist/release/*
          generate_release_notes: true
