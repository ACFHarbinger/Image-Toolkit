# GitLab CI/CD Pipeline
# Equivalent translation of GitHub Actions: agent-sync, benchmark, ci, docs, pixi-update, security

stages:
  - sync
  - test
  - docs
  - security
  - maintenance
  - deploy

variables:
  UV_CACHE_DIR: ".uv-cache"
  PYTHON_VERSION: "3.11"

# Global cache for uv to speed up dependency installation across jobs
default:
  cache:
    key: "uv-cache-${CI_JOB_NAME}"
    paths:
      - .uv-cache
      - .venv

# ==========================================
# STAGE: SYNC (Agent Backlog Sync)
# ==========================================
sync-backlog:
  stage: sync
  image: python:3.11
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"' # Manual trigger via GitLab UI
  variables:
    PYTHONPATH: "."
  script:
    - pip install uv
    - uv sync --frozen --extra ci --no-install-project
    # sync_backlog.py imports agent_tools via a relative import, so it must
    # run as the `git.scripts` package (cwd at the repo root) rather than
    # as a bare script -- same reasoning as git/hooks/post-commit's
    # check_commit_ref.py invocation.
    - uv run python -m git.scripts.sync_backlog
  # Note: Configure GITHUB_TOKEN and GEMINI_API_KEY in GitLab CI/CD Settings -> Variables

# ==========================================
# STAGE: TEST (CI & Benchmark)
# ==========================================
.python_base:
  image: python:3.11
  before_script:
    - pip install uv
    - uv sync --frozen --group dev --no-install-project

lint-and-mypy:
  extends: .python_base
  stage: test
  script:
    - uv run lint-imports
    - uv run mypy backend/src/errors/exceptions.py backend/src/models/core/base.py --ignore-missing-imports --no-error-summary

test-models:
  extends: .python_base
  stage: test
  script:
    - uv run pytest backend/test/models/ -q --tb=short

asp-regression-gate:
  extends: .python_base
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"' # Weekly cron schedule configured in GitLab UI
  script:
    - uv run pytest backend/test/animation/ -q --tb=short --no-header
  artifacts:
    when: always
    paths:
      - .pytest_cache/
    expire_in: 14 days

pytest:
  stage: test
  image: ubuntu:22.04 # Required for C++ build tools & Java
  before_script:
    - apt-get update && apt-get install -y python3.11 python3.11-venv python3-pip openjdk-21-jdk cmake ninja-build libopencv-dev libssl-dev libfftw3-dev libsodium-dev libsqlcipher-dev libeigen3-dev
    - pip3 install uv
    - uv venv && source .venv/bin/activate
    - uv sync --frozen --group dev --no-install-project
  script:
    - ./gradlew :cryptography:shadowJar -Dorg.gradle.java.home="$JAVA_HOME"
    - uv run cmake -B build/base base/ -G Ninja -DCMAKE_BUILD_TYPE=Release
    - uv run cmake --build build/base --parallel
    - uv run cmake --install build/base --prefix .
    - cp -f base*.so "$(uv run python -c 'import site; print(site.getsitepackages()[0])')/" || true
    - uv run pytest --skip-gpu -m "not slow" -q --tb=short
    - uv run pytest --skip-gpu -m "slow" -q --tb=short

# ==========================================
# STAGE: DOCS
# ==========================================
docs-mkdocs:
  extends: .python_base
  stage: docs
  script:
    - uv pip install mkdocs-material mkdocstrings[python] pymdown-extensions griffe mkdocs-jupyter
    # GitLab Pages requires the output directory to be named "public"
    - uv run mkdocs build --config-file docs/mkdocs.yml --strict --verbose --site-dir public
  artifacts:
    paths:
      - public/

docs-links:
  stage: docs
  image: lycheeverse/lychee:latest
  # Exclude list kept in sync with .github/workflows/docs.yml's docs-links
  # job (no .lycheeignore file exists in this repo -- referencing one here
  # would just fail the job outright).
  script:
    - >-
      lychee --verbose --no-progress --include-verbatim
      --exclude 'https://crates.io'
      --exclude 'https://mybinder.org'
      --exclude 'https://polyfill.io'
      --exclude 'https://cdn.jsdelivr.net'
      --exclude 'http://localhost'
      --exclude 'https://localhost'
      --exclude 'http://127\.0\.0\.1'
      --exclude 'https://127\.0\.0\.1'
      --exclude 'https://facebook\.github\.io/create-react-app'
      --exclude 'https://rootly\.com/sre/top-10-observability-tools'
      --exclude 'https://www\.npmjs\.com'
      --exclude 'https://www\.intel\.com'
      --exclude 'https://isocpp\.org'
      --exclude 'cpp-httplib-server\.yhirose\.repl\.co'
      --exclude 'https://sigops\.org/s/conferences/sosp'
      --exclude 'https://www\.postgresql\.org'
      --exclude 'https://vitest\.dev'
      --exclude 'https://www\.brendangregg\.com'
      --exclude 'https://huggingface\.co/spaces'
      --exclude 'https://ieeexplore\.ieee\.org'
      --exclude 'https://openaccess\.thecvf\.com'
      --exclude 'https://api\.jikan\.moe'
      '**/*.md'

# ==========================================
# STAGE: SECURITY
# ==========================================
security-pip-audit:
  stage: security
  image: python:3.11
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - pip install uv pip-audit
    - uv export --frozen --no-emit-project --no-hashes --output-file /tmp/requirements.txt
    - pip-audit -r /tmp/requirements.txt -f json -o /tmp/pip-audit.json || true
  artifacts:
    paths:
      - /tmp/pip-audit.json

security-cargo-audit:
  stage: security
  image: rust:latest
  script:
    - cargo install cargo-audit
    - cd frontend/src-tauri && cargo audit --json > /tmp/cargo-audit.json || true
  artifacts:
    paths:
      - /tmp/cargo-audit.json

# ==========================================
# STAGE: MAINTENANCE
# ==========================================
pixi-update:
  stage: maintenance
  image: ubuntu:22.04
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"' # Triggered by GitLab Pipeline Schedules
  script:
    - apt-get update && apt-get install -y curl
    - curl -fsSL https://pixi.sh/install.sh | bash
    - export PATH="$HOME/.pixi/bin:$PATH"
    - pixi update
  # Note: Pushing a new MR in GitLab CI requires setting up a Project Access Token
  # and using git CLI commands to commit and push the updated pixi.lock.

# ==========================================
# STAGE: DEPLOY (GitLab Pages)
# ==========================================
# This special job name "pages" is required by GitLab to deploy to GitLab Pages
pages:
  stage: deploy
  image: alpine:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH' # Only deploy from main
  dependencies:
    - docs-mkdocs # Pulls the "public/" artifact from the mkdocs job
  script:
    - echo "Deploying MkDocs site to GitLab Pages..."
  artifacts:
    paths:
      - public
