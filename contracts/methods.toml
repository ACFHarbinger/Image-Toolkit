# Method-routing table for the bridge contracts (W0-10, #874).
# This file is the routing table OpenCode's HostClient (#876) flips when a
# Rust duplicate is retired, and the surface Mistral's bridge package (#875)
# frames and the EventHub (#878) consumes.
#
# Schema refs are "<stem>.<Title>": <stem> is the unique schema file stem
# under schemas/ (envelope: request, response, error, event; capability:
# system, jobs, ...), <Title> is a top-level "title" or a $defs entry.
# New capabilities add a schemas/capability/<stem>.json and rows here.

[envelope]
jsonrpc = "2.0"
request = "schemas/envelope/request.json"
response = "schemas/envelope/response.json"
error = "schemas/envelope/error.json"
event = "schemas/envelope/event.json"

[[method]]
name = "system.handshake"
capability = "system"
summary = "Version and capability negotiation at sidecar attach; the UI and sidecar ship as one tested pair (Codex R6)."
params = "system.HandshakeParams"
result = "system.HandshakeResult"
errors = []
cancelable = false
emits = []
stability = "stable"
owner = 875

[[method]]
name = "system.ping"
capability = "system"
summary = "Liveness probe; session-owned."
params = "system.PingParams"
result = "system.PingResult"
errors = []
cancelable = false
emits = []
stability = "stable"
owner = 875

[[method]]
name = "jobs.submit"
capability = "jobs"
summary = "Submit a durable job; spec is opaque at the bridge layer and validated by the owning service. Durable jobs survive window close (Codex R2)."
params = "jobs.SubmitParams"
result = "jobs.SubmitResult"
errors = ["jobs.submit.rejected"]
cancelable = false
emits = ["jobs"]
stability = "experimental"
owner = 876

[[method]]
name = "jobs.cancel"
capability = "jobs"
summary = "Idempotent cooperative cancel with escalation (roadmap Cancel); safe to retry, safe to call on a terminal job."
params = "jobs.CancelParams"
result = "jobs.CancelResult"
errors = ["jobs.not_found"]
cancelable = false
emits = ["jobs"]
stability = "experimental"
owner = 876

[[method]]
name = "jobs.status"
capability = "jobs"
summary = "Point status read; prefer the jobs channel for live progress."
params = "jobs.StatusParams"
result = "jobs.JobStatus"
errors = ["jobs.not_found"]
cancelable = false
emits = []
stability = "experimental"
owner = 876

[[method]]
name = "jobs.list"
capability = "jobs"
summary = "Snapshot read; also the snapshot schema for late joiners on the jobs channel (Kimi Q3)."
params = "jobs.ListParams"
result = "jobs.ListResult"
errors = []
cancelable = false
emits = []
stability = "experimental"
owner = 876

[[method]]
name = "convert.convert"
capability = "convert"
summary = "Convert a single image (pilot #894). Quality is the canonical converter value, 95."
params = "convert.ConvertParams"
result = "convert.ConvertResult"
errors = ["convert.failed"]
cancelable = false
emits = []
stability = "experimental"
owner = 894

[[method]]
name = "cloud_jobs.summary"
capability = "cloud_jobs"
summary = "Header badge for the cloud.jobs shell: running job count and reserved spend (#847)."
params = "cloud_jobs.SummaryParams"
result = "cloud_jobs.SummaryResult"
errors = []
cancelable = false
emits = []
stability = "experimental"
owner = 847

[[method]]
name = "cloud_jobs.list"
capability = "cloud_jobs"
summary = "List cloud jobs with state/provider/kind filters and shard progress (#848)."
params = "cloud_jobs.ListJobsParams"
result = "cloud_jobs.ListJobsResult"
errors = []
cancelable = false
emits = []
stability = "experimental"
owner = 848

[[method]]
name = "cloud_jobs.detail"
capability = "cloud_jobs"
summary = "Read detailed job view: timeline, metrics, spend, outputs, logs, and daemon status (#848)."
params = "cloud_jobs.JobDetailParams"
result = "cloud_jobs.JobDetailResult"
errors = ["jobs.not_found"]
cancelable = false
emits = []
stability = "experimental"
owner = 848

[[method]]
name = "convert.convert_batch"
capability = "convert"
summary = "Queue a cancellable batch conversion (pilot #894). Poll jobs.status for counts; quality stays 95."
params = "convert.ConvertBatchParams"
result = "convert.ConvertBatchResult"
errors = ["convert.failed"]
cancelable = true
emits = ["jobs"]
stability = "experimental"
owner = 894

[[method]]
name = "settings.get"
capability = "settings"
summary = "Read one settings-service key; catalog defaults fill absent values (D5 / #851)."
params = "settings.GetParams"
result = "settings.GetResult"
errors = ["settings.invalid_value"]
cancelable = false
emits = []
stability = "experimental"
owner = 851

[[method]]
name = "settings.set"
capability = "settings"
summary = "Validate and store one key in its ownership scope (D5 / #851)."
params = "settings.SetParams"
result = "settings.SetResult"
errors = ["settings.invalid_value"]
cancelable = false
emits = []
stability = "experimental"
owner = 851

[[method]]
name = "settings.get_many"
capability = "settings"
summary = "Bulk read for a settings form; one round trip over the stdio bridge (D5 / #851)."
params = "settings.GetManyParams"
result = "settings.GetManyResult"
errors = ["settings.invalid_value"]
cancelable = false
emits = []
stability = "experimental"
owner = 851

[[method]]
name = "settings.set_many"
capability = "settings"
summary = "Bulk validate-and-store; all keys write or none do (D5 / #851)."
params = "settings.SetManyParams"
result = "settings.SetManyResult"
errors = ["settings.invalid_value"]
cancelable = false
emits = []
stability = "experimental"
owner = 851

[[channel]]
name = "jobs"
payload = "jobs.JobEventPayload"
snapshot = "jobs.JobListSnapshot"
durable_default = true
producers = ["sidecar", "cloud-jobs-daemon"]
consumers = ["webview"]
notes = "State transitions and progress of durable jobs; replay source is job_events / events.jsonl."

[[channel]]
name = "bridge"
payload = "system.BridgeStatePayload"
snapshot = "system.BridgeStateSnapshot"
durable_default = false
producers = ["supervisor"]
consumers = ["webview"]
notes = "Restart contract (roadmap): bridge.down then bridge.ready around sidecar restarts; in-flight session requests fail with the error envelope."
