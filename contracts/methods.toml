# Method-routing table for the bridge contracts (W0-10, #874).
# This file is the routing table OpenCode's HostClient (#876) flips when a
# Rust duplicate is retired, and the surface Mistral's bridge package (#875)
# frames and the EventHub (#878) consumes.
#
# Schema refs are "<stem>.<Title>": <stem> is the unique schema file stem
# under schemas/ (envelope: request, response, error, event; capability:
# system, jobs, ...), <Title> is a top-level "title" or a $defs entry.
# New capabilities add a schemas/capability/<stem>.json and rows here.

[envelope]
jsonrpc = "2.0"
request = "schemas/envelope/request.json"
response = "schemas/envelope/response.json"
error = "schemas/envelope/error.json"
event = "schemas/envelope/event.json"

[[method]]
name = "system.handshake"
capability = "system"
summary = "Version and capability negotiation at sidecar attach; the UI and sidecar ship as one tested pair (Codex R6)."
params = "system.HandshakeParams"
result = "system.HandshakeResult"
errors = []
cancelable = false
emits = []
stability = "stable"
owner = 875

