[package]
name = "devtool-app"
version = "0.1.0"
description = "Development Tool v2 — Tauri host (D41-D64)"
authors = ["Image-Toolkit"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "devtool_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
dirs = "5"
anyhow = "1"
