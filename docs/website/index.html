<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/images/image_toolkit_icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Image-Toolkit documentation portal and interactive design/engineering hub — image database, ASP pipeline, analytics dashboard, and cross-platform interfaces."
    />
    <title>Image-Toolkit Docs</title>
    <script>
      // GitHub Pages SPA deep-link restore: public/404.html redirects
      // unknown paths to "/?/actual/path" before this script rewrites the
      // URL back via history.replaceState, so vue-router sees the real path.
      (function () {
        var redirect = sessionStorage.getItem("spa-redirect");
        if (redirect) {
          sessionStorage.removeItem("spa-redirect");
          var restored = redirect.replace(/~and~/g, "&");
          if (restored !== location.href) {
            history.replaceState(null, "", restored);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
