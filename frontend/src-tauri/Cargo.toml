[package]
name = "hie-frontend"
version = "0.1.0"
description = "Tauri host for the Hybrid Image Editor"
authors = ["ACFHarbinger"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
