[project]
name = "image-toolkit-git"
version = "1.0.0"
description = "Git utilities for the Image-Toolkit repository."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "requests>=2.31", "google-genai>=0.3"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
