[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cel-shaded-generator-gui"
version = "0.1.0"
description = "Manga Colorization & Animation — desktop Qt/PySide6 UI."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
authors = [{ name = "ACFHarbinger" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "cel-shaded-generator>=0.1.0",
    "pyside6>=6.10.0",
    "numpy>=2.3.4",
    "opencv-python-headless>=4.11.0.86",
]

[project.scripts]
cel-shaded-generator = "csg_gui.app:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools]
# The GUI source tree is intentionally flattened (matching ASP's submodule
# layout), while the installed/imported package keeps a collision-proof name.
package-dir = { csg_gui = "src" }
packages = [
    "csg_gui",
    "csg_gui.components",
    "csg_gui.elements",
    "csg_gui.helpers",
    "csg_gui.tabs",
]

[tool.uv.sources]
cel-shaded-generator = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src", "../logic/src"]
addopts = "-ra"
markers = ["gui: headless Qt GUI test"]
