[project]
name = "hie-gui"
version = "0.1.0"
description = "PySide6 GUI for Hybrid Image Editor"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
hie-gui = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["hie_tab", "main", "viewport"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
