apiVersion: apps/v1
kind: Deployment
metadata:
  name: single-module-template
  labels:
    app: single-module-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app: single-module-template
  template:
    metadata:
      labels:
        app: single-module-template
    spec:
      containers:
        - name: app
          # TODO: point at your real registry once infra/global/docker/Dockerfile is published there.
          image: single-module-template:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: single-module-template-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
