apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: single-module-template
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: single-module-template.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: single-module-template
                port:
                  number: 80
