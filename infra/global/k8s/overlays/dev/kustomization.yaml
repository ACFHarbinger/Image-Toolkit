apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: single-module-template-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: single-module-template
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: single-module-template:dev

configMapGenerator:
  - name: single-module-template-config
    behavior: merge
    literals:
      - APP_LOG_LEVEL=DEBUG
