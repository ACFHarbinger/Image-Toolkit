<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Cranial and jaw variation matrix</title><desc id="desc">A stable cranial mass with neutral, soft, tapered, and broad jaw variants.</desc>
