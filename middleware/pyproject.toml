[project]
name = "hie-middleware"
version = "0.1.0"
description = "Python orchestration boundary for Hybrid Image Editor"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
restoration = ["Pillow>=10.0"]
restoration-opencv = [
    "pillow>=10.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
