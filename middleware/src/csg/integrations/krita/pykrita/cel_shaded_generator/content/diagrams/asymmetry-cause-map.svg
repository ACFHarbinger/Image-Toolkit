<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#20252b"/>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="600" y="70" fill="#e8edf2" font-size="34">NAME THE CAUSE BEFORE KEEPING THE DIFFERENCE</text>
    <g font-size="27"><rect x="70" y="170" width="240" height="250" rx="24" fill="#34414d"/><text x="190" y="235" fill="#6fc4df">ANATOMY / DESIGN</text><text x="190" y="295" fill="#c8d3dc">persistent identity</text><text x="190" y="340" fill="#c8d3dc">scar · eye · jaw · ear</text>
    <rect x="345" y="170" width="240" height="250" rx="24" fill="#34414d"/><text x="465" y="235" fill="#f2c66d">EXPRESSION</text><text x="465" y="295" fill="#c8d3dc">temporary action</text><text x="465" y="340" fill="#c8d3dc">brow · lid · cheek · mouth</text>
    <rect x="620" y="170" width="240" height="250" rx="24" fill="#34414d"/><text x="740" y="235" fill="#8ed29a">PERSPECTIVE</text><text x="740" y="295" fill="#c8d3dc">projection / occlusion</text><text x="740" y="340" fill="#c8d3dc">near · far · overlap</text>
    <rect x="895" y="170" width="240" height="250" rx="24" fill="#4b3035"/><text x="1015" y="235" fill="#ef8b8b">ACCIDENTAL</text><text x="1015" y="295" fill="#c8d3dc">unexplained drift</text><text x="1015" y="340" fill="#c8d3dc">correct against control</text></g>
    <text x="600" y="535" fill="#e8edf2" font-size="29">KEEP only what has a defensible cause and improves the intended reading</text>
  </g>
</svg>
