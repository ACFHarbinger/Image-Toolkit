<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#20252b"/><g font-family="sans-serif" text-anchor="middle"><text x="600" y="65" fill="#e8edf2" font-size="34">DECLARE THE ROLE OF EACH RELATIONSHIP</text><rect x="90" y="145" width="455" height="385" rx="28" fill="#30404a"/><rect x="655" y="145" width="455" height="385" rx="28" fill="#403a30"/><text x="318" y="210" fill="#6fc4df" font-size="32">IDENTITY ANCHORS</text><text x="882" y="210" fill="#f2c66d" font-size="32">VARIATION AXES</text><g fill="#d4dde5" font-size="25"><text x="318" y="275">preserve within selected character</text><text x="318" y="330">cranium ↔ jaw relationship</text><text x="318" y="375">eye rhythm and spacing</text><text x="318" y="420">muzzle · mouth · ear system</text><text x="318" y="465">persistent asymmetry</text><text x="882" y="275">change to generate alternatives</text><text x="882" y="330">proportion bundle</text><text x="882" y="375">feature-shape family</text><text x="882" y="420">age/style tendency</text><text x="882" y="465">shape-language bias</text></g><text x="600" y="595" fill="#e8edf2" font-size="28">A relationship cannot be fixed and freely varied in the same comparison</text></g></svg>
