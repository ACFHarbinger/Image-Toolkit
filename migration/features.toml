# Migration ledger (W0-18 / #882) — one record per capability.
#
# Source of truth for the PySide6 → Tauri migration described in
# docs/moon/roadmaps/tauri_migration.md §2. Validated by
# middleware/validation/check_migration_ledger.py; rendered into
# docs/migration/parity.md by migration/generate_parity.py (do not edit
# the generated file). Schema and lifecycle: migration/README.md.
#
# `id` reuses the #869 catalog ids (middleware/src/shell/catalog.py);
# window rows use dotted ids outside the catalog.
# `native_labels` are the Tauri window labels capabilities name. Dots are
# illegal there, so the cloud.jobs pop-out is cloud-jobs.

[shell]
windows = ["main", "tray", "slideshow", "cloud.jobs", "library.preview"]
native_labels = ["cloud-jobs", "library-preview"]
capabilities = ["default", "cloud-jobs", "library-preview"]

