# migration/features.toml — the migration ledger (W0-18, #882).
#
# One record per capability, not per route (OpenCode Q1: stitch is one record
# with eight routes, Deep Learning one with five). This file is the inventory,
# the parity gate, and the docs index for the PySide6 → Tauri migration
# (docs/moon/roadmaps/tauri_migration.md §2).
#
# Status values: `pyside-only` | `both` | `parity-passed` | `pyside-deleted`.
# Deleting a row requires green parity evidence, a ticked OS checklist,
# Harbinger's sign-off, and one deletion PR that removes that row's PySide6
# code and tests and nothing else.
#
# Consumers — keep these working when editing the schema:
#   - middleware/validation/check_migration_ledger.py (this file's validator:
#     route coverage both ways vs middleware.src.shell.catalog, path
#     existence/deletion, exactly-once gui/src ownership, scenario presence)
#   - middleware/validation/check_migration_additive.py (#884: reads
#     [[exception]] records; a pyside-deleted row auto-allows its own paths)
#   - middleware/validation/check_tauri_security.py (#868: every capability
#     identifier and window label must appear somewhere in this file)
#   - migration/generate_parity.py → docs/migration/parity.md (generated; do
#     not hand-edit — regenerate with `python migration/generate_parity.py`)

[ledger]
version = 1
# The contracts/CONTRACTS.sha256 `total` this ledger was written against
# (#874 coordination). A contract change bumps this pin in the same PR;
# CI fails on drift.
contracts_hash = "982b5ee1c894cc7cc385319c615075e261812de38001db245180d72ca8b6e2c7"

