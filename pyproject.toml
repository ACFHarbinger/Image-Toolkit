[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cel-shaded-generator"
version = "0.1.0"
description = "Manga Colorization & Animation — HITL deep learning + mathematical optimization."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
authors = [{ name = "ACFHarbinger" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "python-dotenv>=1.0.0",
    # Core numerics / image processing
    "numpy>=2.3.4",
    "opencv-python-headless>=4.11.0.86",
    "scipy>=1.16.3",
    "scikit-image>=0.26.0", # SLIC superpixel segmentation for reference-based colorization
    "PyMaxflow>=1.3.2", # Boykov-Kolmogorov max-flow/min-cut for temporal graph-cut coherence
    # GUI
    "pyside6>=6.10.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-benchmark>=4.0.0",
    # validation/ dev-tooling (module dependency graphs, LoC reports)
    "jinja2",
    "rich",
    "pyvis>=0.3.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
addopts = "-ra"
