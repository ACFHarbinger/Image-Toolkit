[project]
name = "image-toolkit-workspace"
version = "0.1.0"
description = "Root workspace manifest for Image-Toolkit. Python modules: backend/ (see backend/pyproject.toml), gui/ (see gui/pyproject.toml), and the submodules/CRE/ git submodule (see submodules/CRE/pyproject.toml)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
# UV does not support nested workspaces. Each entry must point to a leaf
# directory that has a [project] table but no [tool.uv.workspace] of its own.
# Submodule roots (submodules/ASP, submodules/CSG) are themselves workspace
# roots — we list their individual leaf packages instead.
members = [
    # Image-Toolkit core packages
    "backend",
    "gui",
    # ASP submodule leaf packages
    "submodules/ASP/backend",
    "submodules/ASP/gui",
    # CSG submodule leaf packages
    "submodules/CSG/logic",
    "submodules/CSG/gui",
    # Other submodule / internal packages
    "submodules/CRE",
    "git",
]

[dependency-groups]
# CI runs `uv sync --group dev` from the workspace root, so the group must be
# defined here too (uv resolves --group against the invoked project, not
# transitively across workspace members). Mirrors backend/pyproject.toml's
# `dev` group plus gui/pyproject.toml's `dev` group.
dev = [
    "black>=26.5.1",
    "cryptography>=50.0.0",
    "git-filter-repo>=2.47.0",
    "import-linter>=2.13",
    "mypy>=1.18.2",
    "numpy>=2.4.6",
    "pip-audit>=2.9.0",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pyvis>=0.3.2",
    "ruff>=0.14.3",
]

# ComfyUI runtime dependencies.
# Source: vendor/ComfyUI/requirements.txt + vendor/ComfyUI/manager_requirements.txt
#   + vendor/ComfyUI/custom_nodes/ComfyUI-Impact-Pack/requirements.txt
# Sync command: uv sync --group comfyui
#   (or: uv pip install -r vendor/ComfyUI/requirements.txt
#                       -r vendor/ComfyUI/manager_requirements.txt)
# NOTE: torch, torchvision, torchaudio, torchsde, and numpy are intentionally
# omitted — they are already resolved through the backend workspace member
# (backend/pyproject.toml) and pinning them here would create version conflicts.
# Same reasoning covers opencv-python-headless, scikit-image, matplotlib, and
# sam-2 (backend/pyproject.toml already pins all four) — only the genuinely
# new custom-node deps below need adding.
comfyui = [
    # --- Core ComfyUI UI packages ---
    "comfyui-frontend-package==1.45.20",
    "comfyui-workflow-templates==0.11.2",
    "comfyui-embedded-docs==0.5.6",
    # --- ComfyUI native acceleration layers ---
    "comfy-kitchen==0.2.16",
    "comfy-aimdo==0.4.10",
    "comfy-angle",
    # --- ComfyUI-Manager ---
    "comfyui_manager==4.2.2",
    # --- Transformer / tokeniser stack ---
    "einops",
    "transformers>=4.50.3",
    "tokenizers>=0.13.3",
    "sentencepiece",
    "safetensors>=0.4.2",
    # --- Server & networking ---
    "aiohttp>=3.11.8",
    "yarl>=1.18.0",
    "pyyaml",
    "requests",
    # --- Image & media ---
    "Pillow",
    "av>=16.0.0",
    # --- Scientific / utility ---
    "scipy",
    "tqdm",
    "psutil",
    "filelock",
    "blake3",
    "simpleeval>=1.0.0",
    # --- Database (ComfyUI internal asset DB) ---
    "alembic",
    "SQLAlchemy>=2.0.0",
    # --- Non-essential / optional node dependencies ---
    "kornia>=0.7.1",
    "spandrel",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "PyOpenGL>=3.1.8",
    # --- ComfyUI-Impact-Pack (custom node) ---
    "piexif",
    "segment-anything",
    "dill",
]

[tool.uv]
package = false
# Rebuild the C++ extension if CMakeLists or source files change
cache-keys = [{ file = "base/CMakeLists.txt" }, { file = "base/src/**/*.cpp" }, { file = "base/include/**/*.hpp" }]

[tool.pyrefly]
# Core settings
engine = "pylance"          # pyrefly usually wraps a core engine; pylance/pyright is standard
ai_assisted = true          # Enables the "agentic" suggestions seen in your Antigravity view
venvPath = "."              # The directory containing the venv
venv = ".venv"              # The name of the venv folder
type_checking_mode = "basic"
include = ["gui", "backend"]
extraPaths = ["gui/src", "backend/src", "submodules/CRE/src", "submodules/ASP/backend/src", "submodules/CSG/logic/src"]

# Ignore rules (Migration of your pyright/pylance ignores)
ignore = ["**/__init__.py"]

[tool.ruff]
src = ["backend/src", "gui/src"]
line-length = 120
target-version = "py311"
exclude = [
    "notebooks/",
    "docs/*.md",
    "docs/notebooks/",
    "site/",
    "vendor/",
    "submodules/",
    "archive/python/",
]
force-exclude = true

[tool.ruff.lint]
# Ignore E501 (line length) for notebooks specifically if they are messy
ignore = ["E501", "E741", "SIM118"]
select = ["B", "C90", "E", "F", "I", "W", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Ignore F401 (unused import) for __init__.py files
"__init__.py" = ["F401"]

[tool.mypy]
# Permissive baseline — warnings only, no CI failures yet (§5.5A).
# Tighten incrementally: enable disallow_untyped_defs per-module once
# annotations are added to a module.
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
# Per-module overrides — gradually opt in to stricter checking
[[tool.mypy.overrides]]
module = ["backend.src.errors"]
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*", "*Test"]
python_functions = ["test_*", "*_test"]
testpaths = [
    "gui/test",
    "backend/test",
    "submodules/ASP/gui/test",
    "submodules/ASP/backend/test",
    "submodules/ASP/backend/benchmark/evaluation/test",
    "submodules/CRE/test",
    "submodules/CSG/gui/test",
    "submodules/CSG/backend/test",
    "submodules/HIE/gui/test",
]

markers = [
    "gpu: test loads ML model weights into VRAM (DINOv2, RLHF, etc.)",
    "gc_heavy: test allocates large objects; triggers gc.collect() on completion",
    "slow: test takes more than 10 s (excluded from fast CI runs)",
    "forked: run test in isolated subprocess",
]
# §3.12A — pytest-xdist parallel execution (opt-in).
# ASP tests now live in submodules/ASP/backend/test/
# Serial run (default):   pytest submodules/ASP/backend/test/
# Parallel, no GPU tests: pytest submodules/ASP/backend/test/ -n auto --dist=worksteal --skip-gpu
# Parallel, with GPU:     pytest submodules/ASP/backend/test/ -n auto --dist=worksteal
#   (GPU tests run @forked, each in its own subprocess — safe but serial)
# addopts is intentionally empty; parallel execution is never forced.

# ---------------------------------------------------------------------------
# import-linter — layer ordering contracts (§5.11A / A.17)
# Run: PYTHONPATH=. lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["backend", "gui"]

[[tool.importlinter.contracts]]
# The production backend packages must never depend on the GUI.
# Excludes: backend.src.app (app launcher), backend.benchmark, backend.test.
name = "Backend core must not import GUI"
type = "forbidden"
source_modules = [
    "backend.src.models",
    "backend.src.core",
    "backend.src.web",
    "backend.src.pipeline",
    "backend.src.constants",
    "backend.src.errors",
    "backend.src.utils",
]
forbidden_modules = ["gui"]

[[tool.importlinter.contracts]]
# gui.src.utils is the bottom utility layer — no GUI layer may import upward here.
name = "gui.src.utils must not import other GUI layers"
type = "forbidden"
source_modules = ["gui.src.utils"]
forbidden_modules = [
    "gui.src.tabs",
    "gui.src.helpers",
    "gui.src.windows",
    "gui.src.components",
    "gui.src.classes",
]

[[tool.importlinter.contracts]]
# Gallery base classes must not import tab modules (would create circular deps).
# Exception: deferred import of show_main_status from gui.src.windows is allowed.
name = "gui.src.classes must not import gui.src.tabs"
type = "forbidden"
source_modules = ["gui.src.classes"]
forbidden_modules = ["gui.src.tabs"]
ignore_imports = ["gui.src.classes.** -> gui.src.windows.**"]
