name: Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "logic/benchmark/**"
      - "logic/src/**"
      - "logic/include/**"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARK=ON
          cmake --build build --target hybrid_image_editor_benchmark --parallel
          ./build/logic/benchmark/hybrid_image_editor_benchmark
