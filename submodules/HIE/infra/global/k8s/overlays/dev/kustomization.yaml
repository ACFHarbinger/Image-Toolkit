apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hybrid-image-editor-dev

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: hybrid-image-editor
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: hybrid-image-editor:dev

configMapGenerator:
  - name: hybrid-image-editor-config
    behavior: merge
    literals:
      - APP_LOG_LEVEL=DEBUG
